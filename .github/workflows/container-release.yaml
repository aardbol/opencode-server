name: Container Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}-${{ inputs.revision }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  manifest:
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - uses: ./.github/gha-actions/ghcr-login

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ inputs.version }}"
          REVISION="${{ inputs.revision }}"
          VARIANT="${{ matrix.variant }}"

          if [ -z "${REVISION}" ]; then
            {
              echo "amd64=v${VERSION}-${VARIANT}-amd64"
              echo "arm64=v${VERSION}-${VARIANT}-arm64"
              echo "manifest=v${VERSION}-${VARIANT}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "amd64=v${VERSION}-${REVISION}-${VARIANT}-amd64"
              echo "arm64=v${VERSION}-${REVISION}-${VARIANT}-arm64"
              echo "manifest=v${VERSION}-${REVISION}-${VARIANT}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Pull architecture images
        run: |
          buildah pull "docker://${IMAGE}:${{ steps.tags.outputs.amd64 }}"
          buildah pull "docker://${IMAGE}:${{ steps.tags.outputs.arm64 }}"

      - name: Create and push manifest
        id: manifest
        run: |
          VARIANT="${{ matrix.variant }}"
          MANIFEST="${{ steps.tags.outputs.manifest }}"

          buildah manifest create "${MANIFEST}"
          buildah manifest add "${MANIFEST}" "${IMAGE}:${{ steps.tags.outputs.amd64 }}"
          buildah manifest add "${MANIFEST}" "${IMAGE}:${{ steps.tags.outputs.arm64 }}"

          # Push revisioned manifest (immutable)
          buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:${MANIFEST}"

          # Update latest tags (mutable)
          buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:latest-${VARIANT}"

          if [ "${VARIANT}" = "alpine" ]; then
            buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:latest"
          fi

          DIGEST=$(oras resolve "${IMAGE}:${MANIFEST}")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Generate SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ env.IMAGE }}:${{ steps.tags.outputs.manifest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM
        run: |
          DIGEST="${{ steps.manifest.outputs.digest }}"
          oras attach --artifact-type application/spdx+json "${IMAGE}@${DIGEST}" sbom.spdx.json

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          DIGEST="${{ steps.manifest.outputs.digest }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build summary
        run: |
          VERSION="${{ inputs.version }}"
          REVISION="${{ inputs.revision }}"
          VARIANT="${{ matrix.variant }}"
          MANIFEST="${{ steps.tags.outputs.manifest }}"

          if [ -z "${REVISION}" ]; then
            DISPLAY_VERSION="v${VERSION}"
          else
            DISPLAY_VERSION="v${VERSION}-${REVISION}"
          fi

          {
            echo "## Container image: ${VARIANT}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Version | \`${DISPLAY_VERSION}\` |"
            echo "| Tag | \`${MANIFEST}\` |"
            echo "| Digest | \`${{ steps.manifest.outputs.digest }}\` |"
            echo "| SBOM | SPDX JSON attached |"
          } >> "${GITHUB_STEP_SUMMARY}"

  bump:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect current versions
        id: current
        uses: ./.github/gha-actions/detect-versions
        with:
          chart-dir: chart

      - name: Check if bump needed
        id: check
        env:
          TARGET_VERSION: ${{ inputs.version }}
          CURRENT_APP_VERSION: ${{ steps.current.outputs.app_version }}
          CHART_RELEASE_EXISTS: ${{ steps.current.outputs.chart_release_exists }}
        run: |
          set -euo pipefail

          # Skip if appVersion already matches and chart release exists
          if [ "${CURRENT_APP_VERSION}" = "${TARGET_VERSION}" ] && [ "${CHART_RELEASE_EXISTS}" = "true" ]; then
            echo "Chart already released for opencode v${TARGET_VERSION}; skipping bump."
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Chart needs bump for opencode v${TARGET_VERSION}."
            echo "should_bump=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Calculate new chart version
        if: steps.check.outputs.should_bump == 'true'
        id: chart_version
        env:
          CURRENT_APP_VERSION: ${{ steps.current.outputs.app_version }}
          TARGET_OPENCODE_VERSION: ${{ inputs.version }}
        run: |
          # Parse current chart version
          CHART_VERSION=$(yq .version chart/Chart.yaml)
          CHART_MAJOR=$(echo "${CHART_VERSION}" | cut -d. -f1)
          CHART_MINOR=$(echo "${CHART_VERSION}" | cut -d. -f2)
          CHART_PATCH=$(echo "${CHART_VERSION}" | cut -d. -f3)
          
          # Parse current app version
          CURRENT_MAJOR=$(echo "${CURRENT_APP_VERSION}" | cut -d. -f1)
          CURRENT_MINOR=$(echo "${CURRENT_APP_VERSION}" | cut -d. -f2)
          CURRENT_PATCH=$(echo "${CURRENT_APP_VERSION}" | cut -d. -f3)
          
          # Parse target opencode version
          TARGET_MAJOR=$(echo "${TARGET_OPENCODE_VERSION}" | cut -d. -f1)
          TARGET_MINOR=$(echo "${TARGET_OPENCODE_VERSION}" | cut -d. -f2)
          TARGET_PATCH=$(echo "${TARGET_OPENCODE_VERSION}" | cut -d. -f3)
          
          # Determine what changed and apply corresponding bump
          if [ "${TARGET_MAJOR}" != "${CURRENT_MAJOR}" ]; then
            # Major bump in opencode → major bump in chart
            NEW_VERSION="$((CHART_MAJOR + 1)).0.0"
          elif [ "${TARGET_MINOR}" != "${CURRENT_MINOR}" ]; then
            # Minor bump in opencode → minor bump in chart
            NEW_VERSION="${CHART_MAJOR}.$((CHART_MINOR + 1)).0"
          else
            # Patch bump in opencode → patch bump in chart
            NEW_VERSION="${CHART_MAJOR}.${CHART_MINOR}.$((CHART_PATCH + 1))"
          fi
          
          echo "version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Bumping chart from ${CHART_VERSION} to ${NEW_VERSION} (opencode ${CURRENT_APP_VERSION} → ${TARGET_OPENCODE_VERSION})"

      - name: Bump chart version
        if: steps.check.outputs.should_bump == 'true'
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          CHART_VERSION: ${{ steps.chart_version.outputs.version }}
        run: |
          IMAGE_TAG="v${OPENCODE_VERSION}-alpine"
          sed -i "s/^version: .*/version: \"${CHART_VERSION}\"/" chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${OPENCODE_VERSION}\"/" chart/Chart.yaml
          sed -i "s/Support for opencode v[0-9.]*/Support for opencode v${OPENCODE_VERSION}/" chart/Chart.yaml
          sed -i "s|^  tag:.*|  tag: ${IMAGE_TAG}|" chart/values.yaml

      - name: Commit and push chart version bump
        if: steps.check.outputs.should_bump == 'true'
        run: |
          git add chart/Chart.yaml chart/values.yaml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(chart): release ${{ steps.chart_version.outputs.version }} for opencode v${{ inputs.version }}"
            git push
          fi
