name: Trivy Scan

on:
  workflow_run:
    workflows: [Container Build]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        variant: [alpine, debian]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ghcr-login

      - name: Scan ${{ matrix.variant }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:latest-${{ matrix.variant }}
          format: sarif
          output: trivy-results-${{ matrix.variant }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results-${{ matrix.variant }}.sarif
