name: Trivy Scan

on:
  workflow_run:
    workflows: [Container Build]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        variant: [alpine, debian]
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | buildah login -u '${{ github.actor }}' --password-stdin '${{ env.REGISTRY }}'

      - name: Scan ${{ matrix.variant }} image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:latest-${{ matrix.variant }}
          format: sarif
          output: trivy-results-${{ matrix.variant }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@404bd795832c959ffb8efae2b1b4cc1aafc82058 # v3.37.6
        with:
          sarif_file: trivy-results-${{ matrix.variant }}.sarif
