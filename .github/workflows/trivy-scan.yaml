name: Trivy Scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: [Container Build]
    types: [completed]

permissions:
  contents: read

jobs:
  trivy:
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: upcloud-tools/gha-actions/.github/workflows/trivy.yaml@c0df829cbad57268497db8cfb6174419f925b283
    with:
      image_repo: ghcr.io/${{ github.repository }}
