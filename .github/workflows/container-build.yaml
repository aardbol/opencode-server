name: Container Build

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC (poll for new opencode releases)
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version to build (e.g. 1.18.15). Defaults to latest upstream release."
        required: false
        type: string
      build_revision:
        description: "Build revision for rebuilds (e.g. 2, 3)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
      revision: ${{ steps.detect.outputs.revision }}
      should_build: ${{ steps.detect.outputs.should_build }}
      sha256_amd64_alpine: ${{ steps.checksums.outputs.sha256_amd64_alpine }}
      sha256_arm64_alpine: ${{ steps.checksums.outputs.sha256_arm64_alpine }}
      sha256_amd64_debian: ${{ steps.checksums.outputs.sha256_amd64_debian }}
      sha256_arm64_debian: ${{ steps.checksums.outputs.sha256_arm64_debian }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - uses: ./.github/actions/ghcr-login

      - name: Detect version and revision
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${REGISTRY}/${{ github.repository }}"
          INPUT_VERSION="${{ inputs.opencode_version }}"
          INPUT_REVISION="${{ inputs.build_revision }}"
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"

          # Determine opencode version
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            # Validate version exists as upstream release
            if ! gh release view "v${VERSION}" --repo anomalyco/opencode > /dev/null 2>&1; then
              echo "ERROR: OpenCode version ${VERSION} does not exist" >&2
              exit 1
            fi
          else
            VERSION=$(gh release view --repo anomalyco/opencode --json tagName -q .tagName | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # Determine revision
          REVISION="${INPUT_REVISION}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"

          # Determine if we should build
          SHOULD_BUILD="true"
          if [ -z "${REVISION}" ]; then
            # First build - check if image already exists
            if oras resolve "${IMAGE}:v${VERSION}-alpine" > /dev/null 2>&1; then
              echo "Image v${VERSION}-alpine already exists, skipping build."
              SHOULD_BUILD="false"
            else
              echo "New version v${VERSION} detected, will build."
            fi
          else
            # Rebuild - always build
            echo "Rebuild requested: v${VERSION}-${REVISION}, will build."
          fi
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

      - name: Extract checksums from release
        id: checksums
        if: steps.detect.outputs.should_build == 'true'
        uses: ./.github/actions/extract-checksums
        with:
          version: ${{ steps.detect.outputs.version }}

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            arch: amd64
            runner: ubuntu-24.04
          - variant: alpine
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: debian
            arch: amd64
            runner: ubuntu-24.04
          - variant: debian
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ghcr-login

      - name: Set checksum
        id: shas
        run: |
          VARIANT="${{ matrix.variant }}"
          ARCH="${{ matrix.arch }}"
          case "${VARIANT}-${ARCH}" in
            alpine-amd64) SHA="${{ needs.detect.outputs.sha256_amd64_alpine }}" ;;
            alpine-arm64) SHA="${{ needs.detect.outputs.sha256_arm64_alpine }}" ;;
            debian-amd64) SHA="${{ needs.detect.outputs.sha256_amd64_debian }}" ;;
            debian-arm64) SHA="${{ needs.detect.outputs.sha256_arm64_debian }}" ;;
          esac
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set image tag
        id: tags
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          REVISION="${{ needs.detect.outputs.revision }}"
          VARIANT="${{ matrix.variant }}"
          ARCH="${{ matrix.arch }}"

          if [ -z "${REVISION}" ]; then
            # First build: no revision suffix
            echo "image_tag=v${VERSION}-${VARIANT}-${ARCH}" >> "${GITHUB_OUTPUT}"
          else
            # Rebuild: include revision suffix
            echo "image_tag=v${VERSION}-${REVISION}-${VARIANT}-${ARCH}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build ${{ matrix.arch }} image
        env:
          OPENCODE_VERSION: ${{ needs.detect.outputs.version }}
          OPENCODE_SHA256_AMD64: ${{ steps.shas.outputs.sha }}
          OPENCODE_SHA256_ARM64: ${{ steps.shas.outputs.sha }}
          TARGETARCH: ${{ matrix.arch }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
        run: ./build-${{ matrix.variant }}.sh

      - name: Push ${{ matrix.arch }} image
        run: |
          buildah push "${IMAGE}:${{ steps.tags.outputs.image_tag }}" \
            "docker://${IMAGE}:${{ steps.tags.outputs.image_tag }}"

  manifest:
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - uses: ./.github/actions/ghcr-login

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          REVISION="${{ needs.detect.outputs.revision }}"
          VARIANT="${{ matrix.variant }}"

          if [ -z "${REVISION}" ]; then
            # First build: no revision suffix
            echo "amd64=v${VERSION}-${VARIANT}-amd64" >> "${GITHUB_OUTPUT}"
            echo "arm64=v${VERSION}-${VARIANT}-arm64" >> "${GITHUB_OUTPUT}"
            echo "manifest=v${VERSION}-${VARIANT}" >> "${GITHUB_OUTPUT}"
          else
            # Rebuild: include revision suffix
            echo "amd64=v${VERSION}-${REVISION}-${VARIANT}-amd64" >> "${GITHUB_OUTPUT}"
            echo "arm64=v${VERSION}-${REVISION}-${VARIANT}-arm64" >> "${GITHUB_OUTPUT}"
            echo "manifest=v${VERSION}-${REVISION}-${VARIANT}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pull architecture images
        run: |
          buildah pull "docker://${IMAGE}:${{ steps.tags.outputs.amd64 }}"
          buildah pull "docker://${IMAGE}:${{ steps.tags.outputs.arm64 }}"

      - name: Create and push manifest
        id: manifest
        run: |
          VARIANT="${{ matrix.variant }}"
          MANIFEST="${{ steps.tags.outputs.manifest }}"

          buildah manifest create "${MANIFEST}"
          buildah manifest add "${MANIFEST}" "${IMAGE}:${{ steps.tags.outputs.amd64 }}"
          buildah manifest add "${MANIFEST}" "${IMAGE}:${{ steps.tags.outputs.arm64 }}"

          # Push revisioned manifest (immutable)
          buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:${MANIFEST}"

          # Update latest tags (mutable)
          buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:latest-${VARIANT}"

          if [ "${VARIANT}" = "alpine" ]; then
            buildah manifest push --all --format v2s2 "${MANIFEST}" "docker://${IMAGE}:latest"
          fi

          DIGEST=$(oras resolve "${IMAGE}:${MANIFEST}")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ steps.tags.outputs.manifest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM
        run: |
          DIGEST="${{ steps.manifest.outputs.digest }}"
          oras attach --artifact-type application/spdx+json "${IMAGE}@${DIGEST}" sbom.spdx.json

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          DIGEST="${{ steps.manifest.outputs.digest }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build summary
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          REVISION="${{ needs.detect.outputs.revision }}"
          VARIANT="${{ matrix.variant }}"
          MANIFEST="${{ steps.tags.outputs.manifest }}"

          if [ -z "${REVISION}" ]; then
            DISPLAY_VERSION="v${VERSION}"
          else
            DISPLAY_VERSION="v${VERSION}-${REVISION}"
          fi

          {
            echo "## Container image: ${VARIANT}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Version | \`${DISPLAY_VERSION}\` |"
            echo "| Tag | \`${MANIFEST}\` |"
            echo "| Digest | \`${{ steps.manifest.outputs.digest }}\` |"
            echo "| SBOM | SPDX JSON attached |"
          } >> "${GITHUB_STEP_SUMMARY}"
