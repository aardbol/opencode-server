name: Chart Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Container Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  chart-release:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        run: echo '${{ github.token }}' | helm registry login "${{ env.REGISTRY }}" -u '${{ github.actor }}' --password-stdin

      - name: Package chart
        run: helm package chart --destination /tmp/charts

      - name: Push chart to GHCR
        id: push
        run: |
          CHART_TGZ=$(ls /tmp/charts/opencode-server-*.tgz)
          helm push "${CHART_TGZ}" "oci://${REGISTRY}/${{ github.repository }}/charts"

          CHART_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Resolve chart digest
        id: digest
        run: |
          DIGEST=$(oras resolve "${REGISTRY}/${{ github.repository }}/charts/opencode-server:${{ steps.push.outputs.version }}")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart
        run: cosign sign --yes "${REGISTRY}/${{ github.repository }}/charts/opencode-server@${{ steps.digest.outputs.digest }}"

      - name: Release summary
        run: |
          {
            echo "## Helm chart released"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Chart | \`${REGISTRY}/${{ github.repository }}/charts/opencode-server\` |"
            echo "| Version | \`${{ steps.push.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            echo "| Signature | cosign keyless (Sigstore) |"
          } >> "${GITHUB_STEP_SUMMARY}"
