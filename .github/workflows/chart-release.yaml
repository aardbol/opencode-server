name: Chart Release

on:
  workflow_run:
    workflows: ["Container Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  chart-release:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo '${{ github.token }}' | helm registry login "${{ env.REGISTRY }}" -u '${{ github.actor }}' --password-stdin

      - name: Package chart
        run: helm package chart --destination /tmp/charts

      - name: Push chart to GHCR
        run: |
          CHART_TGZ=$(ls /tmp/charts/opencode-server-*.tgz)
          helm push "${CHART_TGZ}" "oci://${REGISTRY}/${{ github.repository }}/charts"
