name: Chart Release

on:
  push:
    branches:
      - main
    paths:
      - "chart/Chart.yaml"
  workflow_dispatch:
    inputs:
      skip-e2e:
        description: Skip e2e tests
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      chart_version: ${{ steps.versions.outputs.chart_version }}
      skip_release: ${{ steps.detect.outputs.skip_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Detect versions
        id: versions
        uses: ./.github/gha-actions/detect-versions
        with:
          chart-dir: chart

      - name: Check if release needed
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          CHART_RELEASE_EXISTS: ${{ steps.versions.outputs.chart_release_exists }}
        run: |
          set -euo pipefail

          if [ "${CHART_RELEASE_EXISTS}" = "true" ]; then
            echo "Chart ${CHART_VERSION} already released; skipping."
            echo "skip_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Chart ${CHART_VERSION} needs release."
            echo "skip_release=false" >> "${GITHUB_OUTPUT}"
          fi

  e2e:
    needs: detect
    if: ${{ needs.detect.outputs.skip_release != 'true' && !inputs['skip-e2e'] }}
    name: chart e2e tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run chart e2e tests
        run: scripts/chart-e2e.sh

  release:
    needs: [detect, e2e]
    if: ${{ always() && needs.detect.outputs.skip_release != 'true' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: upcloud-tools/gha-actions/.github/workflows/release-helm-chart.yaml@c0df829cbad57268497db8cfb6174419f925b283
    with:
      chart_dir: chart
      chart_version: ${{ needs.detect.outputs.chart_version }}
