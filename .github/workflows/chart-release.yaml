name: Chart Release

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version to release the chart for. e.g. 1.18.18"
        required: false
        type: string
  workflow_run:
    workflows: ["Container Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read
    outputs:
      opencode_version: ${{ steps.version.outputs.opencode_version }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download version-info artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: version-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve opencode version
        id: version
        run: |
          if [ -n "${{ inputs.opencode_version }}" ]; then
            OPENCODE_VERSION="${{ inputs.opencode_version }}"
          elif [ -f version-info.txt ]; then
            OPENCODE_VERSION=$(grep '^version=' version-info.txt | cut -d= -f2-)
          else
            OPENCODE_VERSION=$(grep '^appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          fi
          [ -n "${OPENCODE_VERSION}" ] || { echo "could not resolve opencode version" >&2; exit 1; }

          CURRENT_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          MAJOR=$(echo "${CURRENT_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${CURRENT_VERSION}" | cut -d. -f2)
          NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"

          echo "opencode_version=${OPENCODE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing chart ${NEW_VERSION} for opencode ${OPENCODE_VERSION}"

  chart-release:
    needs: detect
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update chart files
        id: update
        env:
          OPENCODE_VERSION: ${{ needs.detect.outputs.opencode_version }}
          CHART_VERSION: ${{ needs.detect.outputs.chart_version }}
        run: |
          IMAGE_TAG="v${OPENCODE_VERSION}-alpine"

          # Update Chart.yaml version and appVersion.
          yq e -i ".version = \"${CHART_VERSION}\"" chart/Chart.yaml
          yq e -i ".appVersion = \"${OPENCODE_VERSION}\"" chart/Chart.yaml

          # Prepend a changelog entry to the artifacthub.io/changes annotation.
          CURRENT_CHANGES=$(yq e '.annotations["artifacthub.io/changes"]' chart/Chart.yaml)
          NEW_CHANGES="- kind: added
          description: Support for opencode v${OPENCODE_VERSION}
          ${CURRENT_CHANGES}"
          export NEW_CHANGES
          yq e -i '.annotations["artifacthub.io/changes"] = strenv(NEW_CHANGES)' chart/Chart.yaml

          # Point the chart at the specific built image instead of "latest".
          yq e -i ".image.tag = \"${IMAGE_TAG}\"" chart/values.yaml

          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push chart version bump
        run: |
          git add chart/Chart.yaml chart/values.yaml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(chart): release ${{ needs.detect.outputs.chart_version }} for opencode v${{ needs.detect.outputs.opencode_version }}"
            git push
          fi

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        run: echo '${{ github.token }}' | helm registry login "${{ env.REGISTRY }}" -u '${{ github.actor }}' --password-stdin

      - name: Package chart
        run: helm package chart --destination /tmp/charts

      - name: Push chart to GHCR
        id: push
        run: |
          CHART_TGZ=$(ls /tmp/charts/opencode-server-*.tgz)
          helm push "${CHART_TGZ}" "oci://${REGISTRY}/${{ github.repository }}/charts"
          echo "version=${{ needs.detect.outputs.chart_version }}" >> "${GITHUB_OUTPUT}"

      - name: Resolve chart digest
        id: digest
        run: |
          DIGEST=$(oras resolve "${REGISTRY}/${{ github.repository }}/charts/opencode-server:${{ steps.push.outputs.version }}")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR with oras
        run: oras login "${{ env.REGISTRY }}" -u "${{ github.actor }}" -p "${{ github.token }}"

      - name: Sign chart
        run: cosign sign --yes "${REGISTRY}/${{ github.repository }}/charts/opencode-server@${{ steps.digest.outputs.digest }}"

      - name: Release summary
        run: |
          {
            echo "## Helm chart released"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Chart | \`${REGISTRY}/${{ github.repository }}/charts/opencode-server\` |"
            echo "| Version | \`${{ steps.push.outputs.version }}\` |"
            echo "| AppVersion | \`${{ needs.detect.outputs.opencode_version }}\` |"
            echo "| Image | \`${{ steps.update.outputs.image_tag }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            echo "| Signature | cosign keyless (Sigstore) |"
          } >> "${GITHUB_STEP_SUMMARY}"
