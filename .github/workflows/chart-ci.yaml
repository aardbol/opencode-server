name: Helm CI

on:
  pull_request:
    paths:
      - "chart/**"
      - "artifacthub-repo.yml"
      - ".kube-linter.yaml"
      - "Makefile"
      - "scripts/chart-e2e.sh"
      - ".github/workflows/chart-ci.yaml"
  push:
    branches:
      - main
    paths:
      - "chart/**"
      - "artifacthub-repo.yml"
      - ".kube-linter.yaml"
      - "Makefile"
      - "scripts/chart-e2e.sh"
      - ".github/workflows/chart-ci.yaml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            lint:
              - 'chart/**'
              - 'artifacthub-repo.yml'
              - '.kube-linter.yaml'
              - 'Makefile'
            e2e:
              - 'scripts/chart-e2e.sh'
              - 'Makefile'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    name: helm validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Helm lint
        run: make helm-lint

      - name: Helm unit tests
        run: make helm-unit-tests

      - name: Helm template test
        run: make helm-template

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: chart
          config: .kube-linter.yaml
          format: plain

      - name: Run kubeconform
        uses: aardbol/k8s-lint@4676a66f5a37b93f2cf75ecbe498d770b9d7d2ce # v5.1.0
        with:
          manifests: chart/
          lintType: kubeconform
          kubeconformOpts: -summary -strict -ignore-missing-schemas

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    name: chart e2e tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run chart e2e tests
        run: scripts/chart-e2e.sh
