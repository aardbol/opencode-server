name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: upcloud-tools/gha-actions/.github/workflows/codeql-actions.yaml@7aa82abc666a4b8107e5c5f1a6c42b49f5f42268
