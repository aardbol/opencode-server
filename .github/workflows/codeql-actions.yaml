name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    uses: upcloud-tools/gha-actions/.github/workflows/codeql-actions.yaml@c0df829cbad57268497db8cfb6174419f925b283
