replicaCount: 1

image:
  repository: ghcr.io/aardbol/opencode-server
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  automount: false
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

env: []

config:
  enabled: true
  path: /home/opencode/opencode.jsonc
  content:
    server:
      port: 4096
      hostname: 0.0.0.0
      cors: []
      mdns: false

auth:
  basic:
    enabled: false
    username: opencode
    existingSecret: ""
    passwordKey: password
    password: ""
  existingSecret: ""
  apiKeySecret: {}
  secretAnnotations: {}

service:
  type: ClusterIP
  port: 4096
  nodePort: null
  loadBalancerIP: null
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencode.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  certManagerIssuer: ""

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /home/opencode
  annotations: {}

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  egress: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

nodeSelector: {}
tolerations: []
affinity: {}
