# Number of OpenCode server replicas.
# Sessions are in-memory and not shared, unless persistence is on.
replicaCount: 1

image:
  # Container image repository and tag. Defaults to the Alpine variant.
  repository: ghcr.io/aardbol/opencode-server
  tag: v1.18.23-alpine
  pullPolicy: IfNotPresent

# Credentials for pulling from container registries.
imagePullSecrets: []
# Override the chart name in the generated resource names.
nameOverride: opencode
# Fully override the generated resource names (overrides nameOverride).
fullnameOverride: ""

podAnnotations: {}
# Extra labels applied to the pod (merged with the default set in _helpers.tpl).
podLabels: {}

serviceAccount:
  # Create a dedicated ServiceAccount for the Deployment.
  create: true
  # Optional explicit name; defaults to the release fullname when empty.
  name: ""
  # Mount the Kubernetes API token into the pod. Keep false unless the server needs to talk to the cluster API (it does not by default).
  automount: false
  annotations: {}

# Pod-level security context. The image runs as the non-root `opencode` user (uid 10001)
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context: minimal privileges, read-only root filesystem.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Extra environment variables for the container
env: []

# Health probe settings. Probes are rendered automatically: they are active when auth is off or a literal auth.basic.password
# is set (probes also require authentication), and omitted when the password comes from an existingSecret.
probes:
  # Shared httpGet target for all probes.
  path: /global/health
  port: http
  # Startup probe gives the server time to boot before liveness takes over.
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Opencode server configuration
config:
  # Render and mount the ConfigMap. When false, the image's simple default is used.
  # This option needs to be true to use either `existingConfigMap` or `content` options.
  enabled: false
  # Mount path inside the container. Matches the image's baked-in default config so the server
  # picks it up via its global config loading.
  path: /home/opencode/.config/opencode/opencode.jsonc
  # Reference an existing ConfigMap (with an opencode.jsonc key) instead of generating one from `content`.
  # Mutually exclusive with `content`.
  existingConfigMap: ""
  # Body of opencode.jsonc, which will be converted to JSON and rendered into a ConfigMap and mounted to config.path.
  # Mutually exclusive with `existingConfigMap`.
  content: {}
  #   default_agent: plan
  #   server:
  #     port: 4096
  #     hostname: "0.0.0.0"
  #     cors: []

auth:
  # If set, the chart skips generating a Secret and references this one instead
  existingSecret: ""
  # Provider API keys, emitted as stringData and injected as env vars of the
  # same name, e.g. `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`.
  apiKeySecret: {}
  # Annotations on the generated Secret.
  secretAnnotations: {}
  
  # HTTP basic authentication
  basic:
    enabled: false
    username: opencode
    # Key inside the basic-auth Secret that holds the password.
    passwordKey: password
    # Reference a pre-created Secret containing the password.
    # Mutually exclusive with `password`.
    existingSecret: ""
    # Password is mutually exclusive with `existingSecret`.
    password: ""


service:
  # ClusterIP is the safe default. Prefer an Ingress for external access.
  type: ClusterIP
  port: 80
  # Static load balancer IP for type: LoadBalancer (cloud-provider dependent).
  annotations: {}
  labels: {}

ingress:
  # Disabled by default. Enable for external HTTP(S) access; pair with auth.basic when exposing publicly.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencode.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  # Persist /home/opencode sessions across restarts.
  enabled: false
  # Use an existing PVC instead of provisioning one.
  existingClaim: ""
  # StorageClass for dynamic provisioning; empty uses cluster default.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /home/opencode
  annotations: {}

# Deny-by-default NetworkPolicy (ingress + egress).
networkPolicy:
  enabled: false
  # Namespace hosting the cluster DNS (kube-dns/CoreDNS) that egress allows.
  dnsNamespace: kube-system
  # Additional egress rules. The default rule only permits DNS.
  egress: []

resources: {}
#  requests:
#    cpu: 250m
#    memory: 256Mi
#  limits:
#    cpu: 1
#    memory: 1Gi

# PodDisruptionBudget to protect availability during voluntary disruptions.
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

nodeSelector: {}

tolerations: []

# Node/pod placement rules. A soft podAntiAffinity is applied by default and merged with any affinity you set here.
affinity: {}

# Spread replicas across nodes or zones.
topologySpreadConstraints: []
#  - maxSkew: 1
#    topologyKey: topology.kubernetes.io/zone
#    whenUnsatisfiable: ScheduleAnyway
#    labelSelector:
