apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "opencode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencode.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "opencode.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: opencode
          image: {{ include "opencode.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ if .Values.config.enabled }}{{ dig "server" "port" 4096 .Values.config.content }}{{ else }}4096{{ end }}
              protocol: TCP
          env:
            {{- if .Values.config.enabled }}
            - name: OPENCODE_CONFIG
              value: {{ .Values.config.path | quote }}
            {{- end }}
            {{- if .Values.auth.basic.enabled }}
            - name: OPENCODE_SERVER_USERNAME
              value: {{ .Values.auth.basic.username | quote }}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode.secretName" . }}
                  key: {{ .Values.auth.basic.passwordKey }}
            {{- end }}
            {{- range $key, $val := .Values.auth.apiKeySecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencode.secretName" . }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.probes.startup }}
          {{- if .enabled }}
          startupProbe:
            httpGet:
              path: {{ $.Values.probes.path }}
              port: {{ $.Values.probes.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.probes.path }}
              port: {{ $.Values.probes.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ $.Values.probes.path }}
              port: {{ $.Values.probes.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: {{ .Values.config.path }}
              subPath: opencode.jsonc
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.config.enabled }}
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap | default (include "opencode.configName" .) }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opencode.pvcName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $defaultAntiAffinity := include "opencode.podAntiAffinity" . | fromYaml }}
      {{- $affinity := .Values.affinity | default dict | deepCopy }}
      {{- if not (hasKey $affinity "podAntiAffinity") }}
      {{- $affinity = set $affinity "podAntiAffinity" $defaultAntiAffinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
