suite: NetworkPolicy
templates:
  - networkpolicy.yaml
release:
  name: opencode-server
tests:
  - it: renders a deny-by-default NetworkPolicy
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: opencode-server
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: allows ingress on the default container port
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 4096

  - it: allows ingress on a custom server port when config is enabled
    set:
      networkPolicy.enabled: true
      config.enabled: true
      config.content.server.port: 8080
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080

  - it: allows DNS egress to the kube-dns namespace
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: UDP
            port: 53
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: TCP
            port: 53

  - it: renders no NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses a custom DNS namespace when configured
    set:
      networkPolicy.enabled: true
      networkPolicy.dnsNamespace: custom-dns
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: custom-dns
