suite: Secret
templates:
  - secret.yaml
release:
  name: opencode-server
tests:
  - it: renders no Secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders provider API keys when configured
    set:
      auth.apiKeySecret:
        ANTHROPIC_API_KEY: sk-ant-test
        OPENAI_API_KEY: sk-oa-test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: opencode-server-secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.ANTHROPIC_API_KEY
          value: sk-ant-test
      - equal:
          path: stringData.OPENAI_API_KEY
          value: sk-oa-test

  - it: renders the basic-auth password when enabled
    set:
      auth.basic.enabled: true
      auth.basic.password: s3cr3t
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.password
          value: s3cr3t

  - it: uses a custom password key for basic auth
    set:
      auth.basic.enabled: true
      auth.basic.password: hunter2
      auth.basic.passwordKey: opencode_password
    asserts:
      - equal:
          path: stringData.opencode_password
          value: hunter2

  - it: renders no Secret when an existing secret is referenced
    set:
      auth.existingSecret: my-opencode-secret
      auth.basic.enabled: true
      auth.basic.password: whatever
    asserts:
      - hasDocuments:
          count: 0
