suite: ConfigMap
templates:
  - configmap.yaml
release:
  name: opencode
tests:
  - it: renders the opencode.jsonc config with the server block
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: opencode-config
      - matchRegex:
          path: data["opencode.jsonc"]
          pattern: '"server"'
      - matchRegex:
          path: data["opencode.jsonc"]
          pattern: '"port":4096'
      - matchRegex:
          path: data["opencode.jsonc"]
          pattern: '"hostname":"0.0.0.0"'

  - it: honors a custom server port in the config content
    set:
      config.content.server.port: 5000
    asserts:
      - matchRegex:
          path: data["opencode.jsonc"]
          pattern: '"port":5000'

  - it: renders no ConfigMap when disabled
    set:
      config.enabled: false
    asserts:
      - hasDocuments:
          count: 0
