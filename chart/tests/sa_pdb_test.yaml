suite: ServiceAccount / PDB
templates:
  - serviceaccount.yaml
  - pdb.yaml
release:
  name: opencode-server
tests:
  - it: creates a ServiceAccount by default
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: opencode-server

  - it: renders no ServiceAccount when create is false
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses a custom ServiceAccount name
    template: serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: renders no PDB by default
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PDB with minAvailable when enabled
    template: pdb.yaml
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.minAvailable
          value: 1

  - it: renders a PDB with maxUnavailable when configured
    template: pdb.yaml
    set:
      pdb.enabled: true
      pdb.maxUnavailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.maxUnavailable
          value: 1
