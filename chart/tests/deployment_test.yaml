suite: Deployment defaults
templates:
  - deployment.yaml
release:
  name: opencode
tests:
  - it: renders a Deployment
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - equal:
          path: metadata.name
          value: opencode

  - it: uses the default replica count and selector labels
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: opencode
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: opencode

  - it: sets the hardened pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: sets the hardened container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: does not automount the service account token by default
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: mounts a /tmp emptyDir but no config by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: config
          any: true

  - it: sets the http port but no config env by default
    asserts:
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4096
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  - it: wires liveness and readiness probes to the health endpoint
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /global/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /global/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: wires a startup probe to the health endpoint
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /global/health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: mounts config and sets env when config.enabled is true
    set:
      config.enabled: true
      config.content:
        default_agent: plan
        server:
          port: 4096
          hostname: "0.0.0.0"
          cors: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /home/opencode/opencode.jsonc
            subPath: opencode.jsonc
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCODE_CONFIG
            value: /home/opencode/opencode.jsonc

  - it: decouples containerPort from service.port when config sets a different server port
    set:
      config.enabled: true
      config.content.server.port: 8080
      service.port: 4096
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: references an existing ConfigMap when configured
    set:
      config.enabled: true
      config.existingConfigMap: my-opencode-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
          any: true
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: my-opencode-config
